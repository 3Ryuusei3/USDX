ABOUT_OVERVIEW=UltraStar Deluxe je besplatna karaoke igra otvorenog koda za tvoj racunar. Doziveljaj igre slican je komercijalnom proizvodu SingStar™ kompanije Sony Computer Entertainment, koji je dostupan iskljucivo na Playstation®-u. Za razliku od SingStar™, UltraStar Deluxe omogucava korisnicima da naprave sopstvene pesme i pevaju ih na racunaru.\nObjavljivanjem izvornog koda omogucili smo ti da igru prilagodis potpuno po svojoj zelji i potrebama.\nPosebno ti je dozvoljeno da menjas proizvod kako god zelis.\n\nNapravi sopstvene teme ili preuzmi sadrzaj zajednice, kao sto su plugini, besplatne pesme ili zakrpe za dodatne funkcije.\nU zabavnom modu do dvanaest igraca moze da peva uz tvoju omiljenu muziku i osvaja poene, u zavisnosti od visine glasa i ritma pevanja.
